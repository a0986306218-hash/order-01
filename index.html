<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>點易 OrderEase</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: sans-serif; background:#2d1f18; }
.menu-card { background:#fff; border-radius:15px; padding:15px; }
.opt-btn { padding:4px 10px; border:1px solid #ccc; border-radius:20px; }
.opt-btn.active { background:#ff6d00; color:#fff; }
</style>
</head>

<body>

<div class="max-w-md mx-auto p-4">

<h2 class="text-white text-xl mb-3">阿明鹹酥雞</h2>

<div>
<button onclick="switchLang('zh')">中文</button>
<button onclick="switchLang('en')">English</button>
</div>

<div id="menu-container" class="menu-card mt-3"></div>

<div class="mt-3 text-white">
總金額：<span id="total-price">0</span>
</div>

<button onclick="submitToSpreadsheet()" class="bg-orange-600 text-white p-3 w-full mt-3">
送出訂單
</button>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxHA2vmGtTgvKUaZEJastl8YhgScbke7nVfIgATv5pUAYjb4KlahpIRc5cyvvPBqzmV/exec";

let menuItems = [];
let cart = {};
let currentLang = "zh";

/* 🔥 JSONP（穩定版） */
function jsonpRequest(url) {
    return new Promise((resolve, reject) => {
        const cb = "cb_" + Date.now();
        const s = document.createElement("script");

        window[cb] = (data) => {
            resolve(data);
            delete window[cb];
            s.remove();
        };

        s.onerror = () => {
            reject("error");
            delete window[cb];
            s.remove();
        };

        // 🔥 關鍵修正（這一行）
        const fullUrl = url.includes("?")
            ? `${url}&callback=${cb}`
            : `${url}?callback=${cb}`;

        s.src = fullUrl;

        document.body.appendChild(s);
    });
}

/* 🔥 載入菜單 */
async function loadMenu(){
    try{
        const result = await jsonpRequest(`${scriptURL}?action=menu`);

        if(result.ok){
            menuItems = result.menu;
            renderMenu();
        }
    }catch(e){
        alert("菜單載入失敗");
    }
}

/* 🔥 渲染 */
function renderMenu(){
    const el = document.getElementById("menu-container");
    el.innerHTML="";

    menuItems.forEach(item=>{
        if(cart[item.id]===undefined) cart[item.id]=0;

        const name = currentLang==="zh"?item.zh:item.en;

        el.innerHTML += `
        <div class="flex justify-between mb-2">
            <div>${name} $${item.price}</div>
            <div>
                <button onclick="updateQty('${item.id}',-1)">-</button>
                ${cart[item.id]}
                <button onclick="updateQty('${item.id}',1)">+</button>
            </div>
        </div>`;
    });

    updateTotal();
}

/* 🔥 數量 */
function updateQty(id,n){
    cart[id]=Math.max(0,cart[id]+n);
    renderMenu();
}

/* 🔥 總價 */
function updateTotal(){
    let total=0;
    menuItems.forEach(i=>{
        total+=cart[i.id]*i.price;
    });
    document.getElementById("total-price").innerText=total;
}

/* 🔥 語言 */
function switchLang(lang){
    currentLang=lang;
    renderMenu();
}

/* 🔥 送單 */
async function submitToSpreadsheet(){

    let items=[];
    let total=0;

    menuItems.forEach(i=>{
        if(cart[i.id]>0){
            items.push(`${i.zh} x${cart[i.id]}`);
            total+=cart[i.id]*i.price;
        }
    });

    if(total===0) return alert("請選餐");

    const params = new URLSearchParams({
        action:"submit",
        items:items.join("\n"),
        total:total
    });

    const result = await jsonpRequest(`${scriptURL}?${params}`);

    if(result.ok){
        alert("成功！");
    }else{
        alert("失敗");
    }
}

/* 啟動 */
loadMenu();

</script>

</body>
</html>
